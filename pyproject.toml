[project]
name = "freecad-featurenamer"
version = "0.2.0"
description = "Name Sketcher and PartDesign features in their FreeCAD task dialog"
readme = "README.md"
license = "LGPL-2.1-or-later"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff", "bandit", "pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
